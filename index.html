<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тисни Першим</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root {
    --bg: #12141c;
    --panel: #1b1f2a;
    --panel-border: #2a2f3d;
    --text: #f5f3ee;
    --text-dim: #9098ac;
    --accent: #ffb020;
    --accent-ink: #1a1200;
    --danger: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  .display { font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 700; letter-spacing: 0.01em; }
  .wrap { flex: 1; display: flex; flex-direction: column; max-width: 640px; width: 100%; margin: 0 auto; padding: 24px 20px 32px; }

  .hero { margin-top: 8vh; margin-bottom: 40px; }
  .hero h1 { font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1; margin: 0 0 10px; text-transform: uppercase; }
  .hero p { color: var(--text-dim); font-size: 1.05rem; max-width: 40ch; margin: 0; }
  .choice-stack { display: flex; flex-direction: column; gap: 14px; margin-top: auto; }
  .choice-stack .hint { display: block; margin-top: 4px; font-size: 0.85rem; font-weight: 400; color: var(--text-dim); }
  .choice-stack .btn-primary .hint { color: var(--accent-ink); opacity: 0.75; }

  button, .btn {
    font-family: inherit; font-size: 1.05rem; font-weight: 600;
    border-radius: 10px; border: 2px solid var(--panel-border);
    background: var(--panel); color: var(--text); padding: 18px 22px;
    cursor: pointer; transition: transform 0.08s ease; text-align: left;
  }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: transparent; }
  .btn-block { width: 100%; }

  label { display: block; font-size: 0.85rem; color: var(--text-dim); margin: 18px 0 6px; }
  input[type=text] {
    width: 100%; font-family: inherit; font-size: 1.15rem; padding: 14px 16px;
    border-radius: 10px; border: 2px solid var(--panel-border);
    background: var(--panel); color: var(--text);
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .error-msg { color: var(--danger); font-size: 0.9rem; margin-top: 10px; min-height: 1.2em; }
  .back-link { background: none; border: none; color: var(--text-dim); padding: 4px 0; font-size: 0.95rem; align-self: flex-start; }

  .code-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .room-code { font-size: clamp(3rem, 16vw, 4.2rem); line-height: 1; }
  .status-pill { display: inline-block; font-size: 0.8rem; color: var(--text-dim); border: 1px solid var(--panel-border); border-radius: 999px; padding: 4px 12px; margin-bottom: 20px; }
  .status-pill.live { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

  .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 4px 0 20px; }
  .player-tile { border: 2px solid var(--panel-border); border-left-width: 6px; border-radius: 8px; background: var(--panel); padding: 12px 14px; font-weight: 600; min-height: 20px; }
  .rank-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 24px; }
  .rank-row { display: flex; align-items: center; gap: 12px; border: 2px solid var(--panel-border); border-left-width: 6px; border-radius: 8px; padding: 10px 14px; background: var(--panel); }
  .rank-num { font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 700; font-size: 1.4rem; width: 1.5em; color: var(--text-dim); }
  .empty-note { color: var(--text-dim); font-size: 0.95rem; padding: 8px 0; }

  .winner-flash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 16px; padding: 40px 20px; animation: flashIn 0.25s ease-out; }
  @keyframes flashIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .winner-flash .who { font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: 1; margin: 0 0 6px; }
  .winner-flash .sub { font-size: 1rem; opacity: 0.85; }

  .waiting-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
  .waiting-panel .big { font-size: clamp(1.8rem, 8vw, 2.4rem); }
  .swatch-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }

  .countdown-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; }
  .countdown-num { font-size: clamp(7rem, 38vw, 13rem); line-height: 1; color: var(--accent); animation: popIn 0.32s ease-out; }
  .countdown-note { color: var(--text-dim); font-size: 1rem; }
  @keyframes popIn { from { transform: scale(0.55); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .buzz-button { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 20px; border: none; font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 700; font-size: clamp(2.4rem, 12vw, 3.6rem); color: var(--accent-ink); padding: 20px; min-height: 46vh; text-align: center; transition: transform 0.06s ease, filter 0.15s ease; }
  .buzz-button:active:not(:disabled) { transform: scale(0.97); }
  .buzz-button:disabled { filter: grayscale(0.6) brightness(0.5); }
  .buzz-button.counting { font-size: clamp(5rem, 30vw, 9rem); color: var(--accent); animation: popIn 0.32s ease-out; }
  .buzz-button.counting:disabled { filter: none; opacity: 1; }

  .result-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 20px; gap: 8px; padding: 30px 20px; }
  .result-panel .headline { font-size: clamp(2rem, 10vw, 2.8rem); line-height: 1; }
  .result-panel .detail { opacity: 0.85; }
  footer.tag { text-align: center; color: var(--text-dim); font-size: 0.8rem; padding-top: 10px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";

  var PALETTE = [
    { name: "Червоний", hex: "#FF4B4B" },
    { name: "Синій",    hex: "#3FA9F5" },
    { name: "Зелений",  hex: "#6FCF3D" },
    { name: "Жовтий",   hex: "#FFD400" },
    { name: "Фіолет",   hex: "#9B5DE5" },
    { name: "Бірюза",   hex: "#35D6C6" },
    { name: "Помаранч", hex: "#FF8A3D" },
    { name: "Рожевий",  hex: "#FF5DA2" }
  ];
  var LIGHT_TEXT = "#12141c";
  var ROOM_PREFIX = "buzzin-";
  var COUNTDOWN_FROM = 3;

  var app = document.getElementById("app");
  var state = { screen: "landing", mode: null }; // mode: "melody" | "questions" — див. renderLanding

  function genCode() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // без 0/O/1/I
    var out = "";
    for (var i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  function sortedPlayers(list) {
    return (list || []).slice().sort(function (a, b) {
      var ta = a.joinedAt || 0, tb = b.joinedAt || 0;
      if (ta !== tb) return ta - tb;
      return String(a.id).localeCompare(String(b.id));
    });
  }

  function colorForPlayer(players, playerId) {
    var sorted = sortedPlayers(players);
    var idx = sorted.findIndex(function (p) { return p.id === playerId; });
    if (idx < 0) idx = 0;
    return PALETTE[idx % PALETTE.length];
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- не даємо екрану згаснути ----------
  var wakeLock = null;

  function wantsWakeLock() {
    return state.screen !== "landing" && state.screen !== "questions-menu";
  }

  function requestWakeLock() {
    if (!navigator.wakeLock || wakeLock || !wantsWakeLock()) return;
    if (document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      lock.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }

  function releaseWakeLock() {
    if (!wakeLock) return;
    var lock = wakeLock;
    wakeLock = null;
    try { lock.release(); } catch (e) {}
  }

  function syncWakeLock() {
    if (wantsWakeLock()) requestWakeLock();
    else releaseWakeLock();
  }

  // браузер сам знімає блокування, коли вкладку сховано — беремо його назад
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") requestWakeLock();
  });

  function render() {
    syncWakeLock();
    if (state.screen === "landing") return renderLanding();
    if (state.screen === "questions-menu") return renderQuestionsMenu();
    if (state.screen === "room-full") return renderRoomFull();
    if (state.screen === "host-connecting") return renderMessage("Готуємо кімнату…");
    if (state.screen === "host") return renderHost();
    if (state.screen === "player-join") return renderPlayerJoin();
    if (state.screen === "player-connecting") return renderMessage("З’єднуємося з ведучим…");
    if (state.screen === "player") return renderPlayer();
    if (state.screen === "peer-unavailable") return renderUnavailable();
  }

  function renderMessage(msg) {
    app.innerHTML = '<div class="wrap"><div class="waiting-panel"><p class="big">' + escapeHtml(msg) + "</p></div></div>";
  }

  function renderUnavailable() {
    app.innerHTML =
      '<div class="wrap"><div class="hero"><h1 class="display">Тисни&nbsp;Першим</h1>' +
      '<p>Не вдалося встановити пряме з’єднання між пристроями. Зазвичай це означає, що мережа його блокує або безкоштовний сервіс з’єднання тимчасово недоступний. Спробуйте ще раз — найкраще в одній Wi-Fi мережі з усіма.</p></div>' +
      '<button class="btn-primary btn-block" id="btn-retry">Спробувати ще раз</button></div>';
    document.getElementById("btn-retry").onclick = function () { state.screen = "landing"; render(); };
  }

  // Вибір гри (state.mode):
  //   "melody"    — «Вгадай мелодію»: ведучим є екран гри, телефон лише кнопка гравця
  //   "questions" — «Є питання»: ведучий на телефоні, гравці підключаються до нього
  function renderLanding() {
    app.innerHTML =
      '<div class="wrap">' +
      '<div class="hero"><h1 class="display">Тисни&nbsp;Першим</h1><p>Для якої гри потрібна кнопка?</p></div>' +
      '<div class="choice-stack">' +
      '<button class="btn-primary btn-block" id="btn-mode-melody">Вгадай мелодію<span class="hint">Кнопка гравця — код кімнати на екрані гри</span></button>' +
      '<button class="btn-ghost btn-block" id="btn-mode-questions">Є питання<span class="hint">Ведучий на телефоні та гравці</span></button>' +
      "</div></div>";
    document.getElementById("btn-mode-melody").onclick = function () { state.mode = "melody"; state.screen = "player-join"; render(); };
    document.getElementById("btn-mode-questions").onclick = function () { state.mode = "questions"; state.screen = "questions-menu"; render(); };
  }

  function renderQuestionsMenu() {
    app.innerHTML =
      '<div class="wrap">' +
      '<button class="back-link" id="btn-back">← Назад</button>' +
      '<div class="hero"><h1 class="display">Є&nbsp;питання</h1><p>Один ведучий, скільки завгодно гравців. Хто натиснув першим — той і виграв раунд.</p></div>' +
      '<div class="choice-stack">' +
      '<button class="btn-primary btn-block" id="btn-host">Створити гру</button>' +
      '<button class="btn-ghost btn-block" id="btn-join">Приєднатися до гри</button>' +
      "</div></div>";
    document.getElementById("btn-back").onclick = function () { state.screen = "landing"; render(); };
    document.getElementById("btn-host").onclick = startHosting;
    document.getElementById("btn-join").onclick = function () { state.screen = "player-join"; render(); };
  }

  function renderRoomFull() {
    app.innerHTML =
      '<div class="wrap"><div class="hero"><h1 class="display">Місць немає</h1>' +
      '<p>У цій грі вже під’єднані всі гравці. Якщо ви один із них — попросіть ведучого перевірити імена та спробуйте ще раз.</p></div>' +
      '<button class="btn-primary btn-block" id="btn-retry">Спробувати ще раз</button></div>';
    document.getElementById("btn-retry").onclick = function () { state.screen = "player-join"; render(); };
  }

  // ---------- ведучий ----------
  var hostPeer = null;
  var hostCode = null;
  var hostConns = {}; // peerId -> {conn, name, joinedAt}
  var hostGame = { status: "lobby", roundId: 0, count: 0, winnerId: null, winnerName: null };
  var hostBuzzOrder = []; // [{playerId, name}] у порядку натискання, для поточного раунду
  var hostAttempts = 0;
  var hostCountdownTimer = null;

  function stopHostCountdown() {
    if (hostCountdownTimer) { clearInterval(hostCountdownTimer); hostCountdownTimer = null; }
  }

  function startHosting() {
    state.screen = "host-connecting";
    render();
    hostAttempts = 0;
    tryCreateHostPeer();
  }

  function tryCreateHostPeer() {
    hostAttempts++;
    hostCode = genCode();
    if (hostPeer) { try { hostPeer.destroy(); } catch (e) {} }
    hostPeer = new Peer(ROOM_PREFIX + hostCode, { debug: 0 });

    hostPeer.on("open", function () {
      stopHostCountdown();
      hostConns = {};
      hostGame = { status: "lobby", roundId: 0, count: 0, winnerId: null, winnerName: null };
      hostBuzzOrder = [];
      state.screen = "host";
      render();
    });

    hostPeer.on("connection", function (conn) {
      conn.on("open", function () {
        conn.on("data", function (msg) { handleHostMessage(conn, msg); });
        conn.on("close", function () {
          delete hostConns[conn.peer];
          broadcastState();
          if (state.screen === "host") render();
        });
      });
    });

    hostPeer.on("error", function (err) {
      if (err && err.type === "unavailable-id" && hostAttempts < 5) {
        tryCreateHostPeer();
      } else {
        state.screen = "peer-unavailable";
        render();
      }
    });
  }

  function handleHostMessage(conn, msg) {
    if (!msg || !msg.type) return;
    if (msg.type === "join") {
      hostConns[conn.peer] = { conn: conn, name: String(msg.name || "Хтось").slice(0, 20), joinedAt: Date.now() };
      broadcastState();
      if (state.screen === "host") render();
    } else if (msg.type === "buzz") {
      // під час відліку status === "countdown", тож ранні натискання не зараховуються
      if (hostGame.status === "armed" && msg.roundId === hostGame.roundId) {
        var p = hostConns[conn.peer];
        var name = p ? p.name : "Хтось";
        if (!hostBuzzOrder.some(function (b) { return b.playerId === conn.peer; })) {
          hostBuzzOrder.push({ playerId: conn.peer, name: name });
        }
        if (hostBuzzOrder.length === 1) {
          hostGame.status = "buzzed";
          hostGame.winnerId = conn.peer;
          hostGame.winnerName = name;
        }
        broadcastState();
        if (state.screen === "host") render();
      }
    }
  }

  function broadcastState() {
    var players = Object.keys(hostConns).map(function (id) {
      return { id: id, name: hostConns[id].name, joinedAt: hostConns[id].joinedAt };
    });
    var payload = { type: "state", game: hostGame, players: players, rest: hostBuzzOrder.slice(1) };
    Object.keys(hostConns).forEach(function (id) {
      try { hostConns[id].conn.send(payload); } catch (e) {}
    });
  }

  function hostStartRound() {
    stopHostCountdown();
    hostGame = { status: "countdown", roundId: hostGame.roundId + 1, count: COUNTDOWN_FROM, winnerId: null, winnerName: null };
    hostBuzzOrder = [];
    broadcastState();
    render();

    hostCountdownTimer = setInterval(function () {
      if (hostGame.status !== "countdown") { stopHostCountdown(); return; }
      hostGame.count -= 1;
      if (hostGame.count <= 0) {
        stopHostCountdown();
        hostGame.count = 0;
        hostGame.status = "armed";
      }
      broadcastState();
      if (state.screen === "host") render();
    }, 1000);
  }

  function hostReset() {
    stopHostCountdown();
    hostGame.status = "lobby";
    hostGame.count = 0;
    hostGame.winnerId = null;
    hostGame.winnerName = null;
    broadcastState();
    render();
  }

  function renderHost() {
    var players = Object.keys(hostConns).map(function (id) {
      return { id: id, name: hostConns[id].name, joinedAt: hostConns[id].joinedAt };
    });
    var statusLabel =
      hostGame.status === "armed" ? "у грі — чекаємо на натискання" :
      hostGame.status === "countdown" ? "відлік…" :
      hostGame.status === "buzzed" ? "натиснуто" : "очікування";

    var playersHtml = sortedPlayers(players).map(function (p, i) {
      var c = PALETTE[i % PALETTE.length];
      return '<div class="player-tile" style="border-left-color:' + c.hex + '">' + escapeHtml(p.name) + "</div>";
    }).join("");

    var body;
    if (hostGame.status === "buzzed") {
      var sorted = sortedPlayers(players);
      var wIdx = sorted.findIndex(function (p) { return p.id === hostGame.winnerId; });
      var winnerColor = wIdx >= 0 ? PALETTE[wIdx % PALETTE.length].hex : "#555";
      var rest = hostBuzzOrder.slice(1);
      var restHtml = rest.length ? '<div class="rank-list">' + rest.map(function (b, i) {
        var idx = sorted.findIndex(function (p) { return p.id === b.playerId; });
        var c = idx >= 0 ? PALETTE[idx % PALETTE.length] : { hex: "#555" };
        return '<div class="rank-row" style="border-left-color:' + c.hex + '"><span class="rank-num">' + (i + 2) + '</span><span>' + escapeHtml(b.name) + "</span></div>";
      }).join("") + "</div>" : "";
      body =
        '<div class="winner-flash" style="background:' + winnerColor + "22;border:2px solid " + winnerColor + '">' +
        '<div class="who display" style="color:' + winnerColor + '">' + escapeHtml(hostGame.winnerName || "Хтось") + "</div>" +
        '<div class="sub">натиснув першим</div></div>' + restHtml +
        '<button class="btn-primary btn-block" id="btn-reset">Наступний раунд</button>';
    } else if (hostGame.status === "countdown") {
      body =
        '<div class="countdown-panel"><div class="countdown-num display">' + hostGame.count + "</div>" +
        '<div class="countdown-note">Приготуйтеся…</div></div>' +
        '<button class="btn-primary btn-block" disabled>Відлік…</button>';
    } else {
      body =
        '<div class="player-grid">' + (playersHtml || '<div class="empty-note">Чекаємо на гравців…</div>') + "</div>" +
        '<button class="btn-primary btn-block" id="btn-start" ' + (players.length === 0 ? "disabled" : "") + ">" +
        (hostGame.status === "armed" ? "Раунд триває — натисніть, щоб перезапустити" : "Почати раунд") + "</button>";
    }

    app.innerHTML =
      '<div class="wrap">' +
      '<button class="back-link" id="btn-leave">← Завершити гру</button>' +
      '<div class="code-row"><div class="room-code display">' + hostCode + "</div></div>" +
      '<div class="status-pill' + (hostGame.status === "armed" ? " live" : "") + '">' + statusLabel + "</div>" +
      body +
      '<footer class="tag">Гравці заходять за кодом ' + hostCode + " — не закривайте цю вкладку</footer>" +
      "</div>";

    var btnStart = document.getElementById("btn-start");
    if (btnStart) btnStart.onclick = hostStartRound;
    var btnReset = document.getElementById("btn-reset");
    if (btnReset) btnReset.onclick = hostReset;
    document.getElementById("btn-leave").onclick = function () {
      stopHostCountdown();
      if (hostPeer) { try { hostPeer.destroy(); } catch (e) {} }
      hostPeer = null;
      state.screen = "questions-menu";
      render();
    };
  }

  // ---------- гравець ----------
  var pPeer = null;
  var pConn = null;
  var playerCode = null;
  var playerName = null;
  var pGame = { status: "lobby", roundId: 0, count: 0, winnerId: null, winnerName: null };
  var pPlayers = [];
  var pRest = [];
  var pLocked = []; // id гравців, які вже помилилися на цій мелодії (лише «Вгадай мелодію»)
  var hasBuzzedThisRound = false;

  function renderPlayerJoin() {
    app.innerHTML =
      '<div class="wrap">' +
      '<button class="back-link" id="btn-back">← Назад</button>' +
      '<div class="hero"><h1 class="display">Вхід</h1><p>' +
      (state.mode === "melody" ? "Код кімнати показано на екрані гри." : "Запитайте код кімнати у ведучого.") + "</p></div>" +
      '<label for="in-code">Код кімнати</label>' +
      '<input type="text" id="in-code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD">' +
      '<label for="in-name">Ваше ім’я</label>' +
      '<input type="text" id="in-name" maxlength="20" autocomplete="off" placeholder="напр. Олена">' +
      '<div class="error-msg" id="join-error"></div>' +
      '<button class="btn-primary btn-block" id="btn-do-join" style="margin-top:16px">Приєднатися</button>' +
      "</div>";
    document.getElementById("btn-back").onclick = function () {
      state.screen = state.mode === "questions" ? "questions-menu" : "landing";
      render();
    };
    document.getElementById("btn-do-join").onclick = attemptJoin;
  }

  function attemptJoin() {
    var code = (document.getElementById("in-code").value || "").trim().toUpperCase();
    var name = (document.getElementById("in-name").value || "").trim();
    var errEl = document.getElementById("join-error");
    if (code.length !== 4) { errEl.textContent = "Введіть код кімнати з 4 символів."; return; }
    if (!name) { errEl.textContent = "Введіть ваше ім’я."; return; }
    errEl.textContent = "";
    playerCode = code;
    playerName = name;
    hasBuzzedThisRound = false;
    state.screen = "player-connecting";
    render();

    if (pPeer) { try { pPeer.destroy(); } catch (e) {} }
    pPeer = new Peer(undefined, { debug: 0 });

    pPeer.on("open", function () {
      pConn = pPeer.connect(ROOM_PREFIX + code, { reliable: true });

      var failTimer = setTimeout(function () {
        if (state.screen === "player-connecting") {
          state.screen = "player-join";
          render();
          var e = document.getElementById("join-error");
          if (e) e.textContent = "Не знайшли гру з таким кодом. Перевірте його та спробуйте ще раз.";
        }
      }, 8000);

      pConn.on("open", function () {
        clearTimeout(failTimer);
        pConn.send({ type: "join", name: name });
        pConn.on("data", function (msg) { handlePlayerMessage(msg); });
        pConn.on("close", function () {
          if (state.screen !== "player") return; // напр. після відмови «місць немає»
          state.screen = "peer-unavailable";
          render();
        });
        state.screen = "player";
        render();
      });
      pConn.on("error", function () { clearTimeout(failTimer); });
    });

    pPeer.on("error", function () {
      state.screen = "player-join";
      render();
      var e = document.getElementById("join-error");
      if (e) e.textContent = "Не вдалося під’єднатися. Перевірте код або підключіться до тієї ж Wi-Fi, що й ведучий.";
    });
  }

  var lastRoundSeen = null;
  function handlePlayerMessage(msg) {
    if (msg && msg.type === "rejected") {
      state.screen = "room-full";
      render();
      if (pPeer) { try { pPeer.destroy(); } catch (e) {} }
      pPeer = null;
      return;
    }
    if (!msg || msg.type !== "state") return;
    if (lastRoundSeen !== null && msg.game.roundId !== lastRoundSeen) hasBuzzedThisRound = false;
    lastRoundSeen = msg.game.roundId;
    pGame = msg.game;
    pPlayers = msg.players || [];
    pRest = msg.rest || [];
    pLocked = msg.locked || [];
    if (state.screen === "player") render();
  }

  function isLockedOut() {
    return !!pPeer && pLocked.indexOf(pPeer.id) >= 0;
  }

  function playerBuzz() {
    if (hasBuzzedThisRound || isLockedOut() || pGame.status !== "armed" || !pConn) return;
    hasBuzzedThisRound = true;
    render();
    try { pConn.send({ type: "buzz", roundId: pGame.roundId }); } catch (e) {}
  }

  function renderPlayer() {
    var myColor = colorForPlayer(pPlayers, pPeer ? pPeer.id : null);

    if (pGame.status === "buzzed") {
      var won = pGame.winnerId === (pPeer ? pPeer.id : null);
      var bg = won ? myColor.hex : "#1b1f2a";
      var ink = won ? LIGHT_TEXT : "var(--text)";
      app.innerHTML =
        '<div class="wrap"><div class="result-panel" style="background:' + bg + ";color:" + ink + '">' +
        '<div class="headline display">' + (won ? "Ти перший!" : "Не встиг") + "</div>" +
        '<div class="detail">' + (won ? "Усі дивляться на тебе." : escapeHtml(pGame.winnerName || "Хтось") + " натиснув першим.") + "</div>" +
        "</div>" +
        '<p style="text-align:center;color:var(--text-dim);margin-top:14px">Чекаємо, поки ведучий почне наступний раунд…</p></div>';
      return;
    }

    var counting = pGame.status === "countdown";
    var armed = pGame.status === "armed";
    var lockedOut = isLockedOut();
    var canBuzz = armed && !hasBuzzedThisRound && !lockedOut;
    var label =
      counting ? String(pGame.count == null ? "" : pGame.count) :
      lockedOut ? "Чекай наступну мелодію" :
      hasBuzzedThisRound ? "Натиснуто!" :
      armed ? "ТИСНИ" : "Чекайте…";

    app.innerHTML =
      '<div class="wrap">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
      '<span><span class="swatch-dot" style="background:' + myColor.hex + '"></span>' + escapeHtml(playerName) + "</span>" +
      '<span style="color:var(--text-dim);font-size:0.85rem">кімната ' + playerCode + "</span></div>" +
      '<button class="buzz-button' + (counting ? " counting" : "") + '" id="btn-buzz" style="background:' + (canBuzz ? myColor.hex : "#2a2f3d") + '" ' +
      (canBuzz ? "" : "disabled") + ">" + label + "</button></div>";

    var btn = document.getElementById("btn-buzz");
    if (btn) btn.onclick = playerBuzz;
  }

  render();
})();
</script>
</body>
</html>
